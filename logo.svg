<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <defs>
    <linearGradient id="czGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E60FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2A4D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Icon Container Badge -->
  <rect x="10" y="14" width="72" height="72" rx="18" fill="url(#bgGrad)" stroke="#1E60FF" stroke-width="2.2" filter="url(#glow)" />

  <!-- Circuit Accent Lines -->
  <path d="M18 50h8M64 50h8M50 18v8M50 74v8" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- PC Monitor Icon -->
  <rect x="25" y="27" width="42" height="28" rx="5" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
  <rect x="29" y="31" width="34" height="20" rx="3" fill="url(#czGrad)" opacity="0.95" />
  <path d="M41 55h10l3 10H38l3-10z" fill="#FFFFFF" />
  <rect x="33" y="65" width="26" height="3" rx="1.5" fill="#38BDF8" />

  <!-- Active Status Indicator Dot -->
  <circle cx="63" cy="30" r="3.5" fill="#38BDF8" filter="url(#glow)"/>

  <!-- Typography -->
  <!-- "COMPUTER" -->
  <text x="96" y="52" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">COMPUTER</text>

  <!-- "ZONE" in Electric Royal Blue Gradient -->
  <text x="252" y="52" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="28" font-weight="800" fill="#38BDF8" letter-spacing="0.5">ZONE</text>

  <!-- Subtitle Tagline -->
  <text x="98" y="73" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#94A3B8" letter-spacing="2.2">DOORSTEP PC &amp; LAPTOP REPAIR · LUCKNOW</text>
</svg>
